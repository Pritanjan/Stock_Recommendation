version: ''3.8''

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - " 8000:8000\
 environment:
 - PYTHONUNBUFFERED=1
 restart: unless-stopped

 frontend:
 build:
 context: ./frontend
 dockerfile: Dockerfile
 args:
 NEXT_PUBLIC_API_URL: http://localhost:8000
 NEXT_PUBLIC_WS_URL: ws://localhost:8000
 ports:
 - \3000:3000\
 depends_on:
 - backend
 restart: unless-stopped
